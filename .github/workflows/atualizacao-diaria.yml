name: Atualizacao intradiaria do dashboard

on:
  schedule:
    - cron: "*/15 10-18 * * 1-5"
      timezone: "America/Sao_Paulo"
    - cron: "0 19 * * 1-5"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicacao-dashboard
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v6

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar dependencias R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          install-quarto: false
          packages: |
            any::knitr
            any::rmarkdown
            any::jsonlite
            any::dplyr
            any::tibble
            any::lubridate
            any::quantmod
            any::zoo
            any::plotly
            any::scales

      - name: Atualizar dados e publicar
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: selic_bova11.qmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
